name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package addon
        run: |
          bash scripts/build-release.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/CopyEnglishName*.zip
          generate_release_notes: true
